<svg xmlns="http://www.w3.org/2000/svg" width="920" height="700" viewBox="0 0 920 700" font-family="Arial, Helvetica, sans-serif" font-size="13">
  <rect width="920" height="700" fill="#ffffff"/>
  <g transform="translate(0,90)">

  <!-- LED indicators (active-low): 5V -> LED -> 220 ohm -> pin -->
  <g fill="none" stroke="#222" stroke-width="2">
    <path d="M385 90V72 M385 32V12 M385 -12V-40"/>
    <path d="M535 90V72 M535 32V12 M535 -12V-40"/>
    <rect x="378" y="32" width="14" height="40" fill="#f5f5f5"/>
    <rect x="528" y="32" width="14" height="40" fill="#f5f5f5"/>
    <path d="M373 -12H397L385 8Z M373 8H397" fill="#f5f5f5"/>
    <path d="M523 -12H547L535 8Z M523 8H547" fill="#f5f5f5"/>
    <path d="M399 -6l10 -8 M402 2l10 -8 M549 -6l10 -8 M552 2l10 -8" stroke-width="1.5"/>
  </g>
  <g fill="#222">
    <circle cx="385" cy="90" r="3"/><circle cx="535" cy="90" r="3"/>
    <path d="M409 -14l-5 1 3 3Z M412 -6l-5 1 3 3Z M559 -14l-5 1 3 3Z M562 -6l-5 1 3 3Z"/>
  </g>
  <g fill="#111">
    <g text-anchor="end">
      <text x="370" y="56">220Ω</text>
      <text x="368" y="2" font-weight="bold">Left LED</text>
    </g>
    <text x="550" y="56">220Ω</text>
    <text x="572" y="2" font-weight="bold">Right LED</text>
    <g text-anchor="middle" font-weight="bold">
      <text x="385" y="-46">5V</text>
      <text x="535" y="-46">5V</text>
    </g>
    <g text-anchor="middle">
      <text x="385" y="110">D8</text>
      <text x="535" y="110">D6</text>
    </g>
  </g>

  <g fill="none" stroke="#222" stroke-width="2">
    <!-- blocks -->
    <rect x="360" y="90" width="200" height="360" rx="6" fill="#eef2f7"/>
    <rect x="80" y="130" width="170" height="90" rx="6" fill="#f5f5f5"/>
    <rect x="80" y="280" width="170" height="80" rx="6" fill="#f5f5f5"/>
    <rect x="670" y="130" width="170" height="90" rx="6" fill="#f5f5f5"/>
    <rect x="670" y="280" width="170" height="80" rx="6" fill="#f5f5f5"/>
    <rect x="290" y="500" width="140" height="70" rx="6" fill="#f5f5f5"/>
    <rect x="450" y="500" width="200" height="70" rx="6" fill="#f5f5f5"/>

    <!-- signal wires -->
    <path d="M250 160H360 M250 190H360 M250 320H360"/>
    <path d="M560 160H670 M560 190H670 M560 320H670"/>
    <path d="M390 450V500 M470 450V500 M510 450V500"/>

    <!-- power stubs -->
    <path d="M430 90V62 M490 90V62"/>
    <path d="M80 160H52 M80 190H52 M80 320H52 M80 345H52"/>
    <path d="M840 160H868 M840 190H868 M840 320H868 M840 345H868"/>
    <path d="M290 520H262 M290 548H262"/>
    <path d="M650 520H678 M650 548H678"/>
  </g>

  <!-- pin dots -->
  <g fill="#222">
    <circle cx="250" cy="160" r="3"/><circle cx="360" cy="160" r="3"/>
    <circle cx="250" cy="190" r="3"/><circle cx="360" cy="190" r="3"/>
    <circle cx="250" cy="320" r="3"/><circle cx="360" cy="320" r="3"/>
    <circle cx="560" cy="160" r="3"/><circle cx="670" cy="160" r="3"/>
    <circle cx="560" cy="190" r="3"/><circle cx="670" cy="190" r="3"/>
    <circle cx="560" cy="320" r="3"/><circle cx="670" cy="320" r="3"/>
    <circle cx="390" cy="450" r="3"/><circle cx="390" cy="500" r="3"/>
    <circle cx="470" cy="450" r="3"/><circle cx="470" cy="500" r="3"/>
    <circle cx="510" cy="450" r="3"/><circle cx="510" cy="500" r="3"/>
    <circle cx="430" cy="90" r="3"/><circle cx="490" cy="90" r="3"/>
    <circle cx="80" cy="160" r="3"/><circle cx="80" cy="190" r="3"/>
    <circle cx="80" cy="320" r="3"/><circle cx="80" cy="345" r="3"/>
    <circle cx="840" cy="160" r="3"/><circle cx="840" cy="190" r="3"/>
    <circle cx="840" cy="320" r="3"/><circle cx="840" cy="345" r="3"/>
    <circle cx="290" cy="520" r="3"/><circle cx="290" cy="548" r="3"/>
    <circle cx="650" cy="520" r="3"/><circle cx="650" cy="548" r="3"/>
  </g>

  <g fill="#111">
    <!-- block titles -->
    <g font-weight="bold" font-size="15" text-anchor="middle">
      <text x="460" y="255">Arduino Uno</text>
      <text x="165" y="150">HC-SR04 Left</text>
      <text x="165" y="300">Servo Left</text>
      <text x="755" y="150">HC-SR04 Right</text>
      <text x="755" y="300">Servo Right</text>
      <text x="378" y="547">Pot 10k</text>
      <text x="545" y="550">LCD 20x4 I2C</text>
    </g>

    <!-- Uno pin labels -->
    <text x="368" y="164">D11</text>
    <text x="368" y="194">D10</text>
    <text x="368" y="324">D12</text>
    <g text-anchor="end">
      <text x="552" y="164">D4</text>
      <text x="552" y="194">D3</text>
      <text x="552" y="324">D2</text>
    </g>
    <g text-anchor="middle">
      <text x="430" y="110">5V</text>
      <text x="490" y="110">GND</text>
      <text x="390" y="440">A0</text>
      <text x="470" y="440">A4</text>
      <text x="510" y="440">A5</text>
    </g>

    <!-- component pin labels -->
    <text x="88" y="164">VCC</text>
    <text x="88" y="194">GND</text>
    <text x="88" y="324">V+</text>
    <text x="88" y="349">GND</text>
    <g text-anchor="end">
      <text x="242" y="164">TRIG</text>
      <text x="242" y="194">ECHO</text>
      <text x="242" y="324">PWM</text>
      <text x="832" y="164">VCC</text>
      <text x="832" y="194">GND</text>
      <text x="832" y="324">V+</text>
      <text x="832" y="349">GND</text>
      <text x="642" y="524">VCC</text>
      <text x="642" y="552">GND</text>
    </g>
    <text x="678" y="164">TRIG</text>
    <text x="678" y="194">ECHO</text>
    <text x="678" y="324">PWM</text>
    <text x="298" y="524">VCC</text>
    <text x="298" y="552">GND</text>
    <g text-anchor="middle">
      <text x="390" y="517">SIG</text>
      <text x="470" y="517">SDA</text>
      <text x="510" y="517">SCL</text>
    </g>

    <!-- power net labels -->
    <g font-weight="bold">
      <g text-anchor="middle">
        <text x="430" y="55">5V</text>
        <text x="490" y="55">GND</text>
      </g>
      <g text-anchor="end">
        <text x="47" y="164">5V</text>
        <text x="47" y="194">GND</text>
        <text x="47" y="324">5V</text>
        <text x="47" y="349">GND</text>
        <text x="257" y="524">5V</text>
        <text x="257" y="552">GND</text>
      </g>
      <text x="873" y="164">5V</text>
      <text x="873" y="194">GND</text>
      <text x="873" y="324">5V</text>
      <text x="873" y="349">GND</text>
      <text x="683" y="524">5V</text>
      <text x="683" y="552">GND</text>
    </g>

    <text x="460" y="600" text-anchor="middle" font-size="12" fill="#444">Every 5V label connects to the Arduino 5V pin and every GND label to Arduino GND. LEDs are active-low (pin LOW = on).</text>
  </g>
  </g>
</svg>
